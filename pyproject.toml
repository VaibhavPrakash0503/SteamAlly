[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SteamAlly"
version = "0.1.0"
description = "Non-Steam games manager for Linux."
authors = [
    {name = "Vaibhav Prakash"}
]
dependencies = [
  "vdf>=3.0",
  "click",
]
required-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "ruff",
  "pyright",
]

[tool.pyright]
include = ["src"]
executionEnvironments = [
  { root = "src", pythonVersion = "3.11" }
]
typeCheckingMode = "basic"
reportMissingImports = true

[tool.ruff]
line-length = 100
target-version = "py311"
