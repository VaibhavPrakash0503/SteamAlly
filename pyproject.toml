[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SteamAlly"
version = "0.1.0"
description = "Non-Steam games manager for Linux."
authors = [
    {name = "Vaibhav Prakash"}
]
dependencies = [
  "vdf>=3.0",
  "click",
]
required-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "ruff",
  "pyright",
]

